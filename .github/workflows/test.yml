name: test

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        resolution: [highest, lowest-direct]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # lg upgrade 테스트가 이전 릴리즈 tag로 옛 프로젝트를 만든다
      - uses: astral-sh/setup-uv@v6
      - run: uv venv --python ${{ matrix.python }} .venv
      - run: uv pip install --python .venv/bin/python --resolution ${{ matrix.resolution }} -e '.[dev]'
      - run: .venv/bin/python -m pytest -q

  hook-python39:
    # 생성되는 commit-msg hook과 scripts/는 Python >= 3.9를 지원한다 (설계 문서 §4)
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv python install 3.9
      - run: uv venv --python 3.12 .venv
      - run: uv pip install --python .venv/bin/python -e '.[dev]'
      - run: HOOK_PYTHON="$(uv python find 3.9)" .venv/bin/python -m pytest -q tests/test_hook.py tests/test_commit.py tests/test_apply.py
