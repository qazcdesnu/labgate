[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "labgate"
version = "0.1.0"
description = "Initialize human-gated, agent-driven research project workspaces"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "typer>=0.15.4",
  "questionary>=2.0",
  "jinja2>=3.1",
  "pyyaml>=6.0.2",
  "pydantic>=2.8",
]

[project.optional-dependencies]
dev = ["pytest>=8", "hatchling>=1.24"]

[project.scripts]
lg = "labgate.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/labgate"]

[tool.pytest.ini_options]
testpaths = ["tests"]
