[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "labgate"
version = "0.7.0"
description = "Initialize human-gated, agent-driven research project workspaces"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "typer>=0.15.4",
  "questionary>=2.0",
  "jinja2>=3.1",
  "pyyaml>=6.0.2",
  "pydantic>=2.8",
  # Python 3.14용 wheel이 있는 첫 버전 (그 아래는 소스 빌드 실패)
  "pyyaml>=6.0.3; python_version >= '3.14'",
  "pydantic>=2.12; python_version >= '3.14'",
]

[project.optional-dependencies]
dev = ["pytest>=8", "hatchling>=1.24"]

[project.scripts]
lg = "labgate.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/labgate"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]          # tests/support 패키지
addopts = "--import-mode=importlib"
markers = [
    "unit: 순수 함수 (Git, 하위 프로세스 없음)",
    "contract: 생성 내용·문서·해시표가 설계와 코드에 맞는지",
    "tools: 생성된 hook과 scripts/를 실제 Git 저장소에서 (Python 3.9로도 실행)",
    "commands: lg 명령을 실제 프로젝트에서",
    "e2e: 설치된 lg 실행 파일을 별도 프로세스로",
]
